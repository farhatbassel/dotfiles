unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

set -g @plugin 'tmux-plugins/tpm'
set-option -g status-position top

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'erikw/tmux-powerline' # keep only the useful Powerline segments
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

bind-key "f" run-shell "sesh connect \"$(
  fd . ~/projects --min-depth=1 --max-depth=1 -td | fzf --tmux center,80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^f find ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd . ~/projects --min-depth=1 --max-depth=1 -td )' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

set-option -sg escape-time 10
set-option -g focus-events on

# set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
# set -g @continuum-restore 'on' # enable tmux-continuum functionality

bind-key -r h run-shell "~/.scripts/tmux-sessionizer.sh ~/projects/Cockpit"
bind-key -r j run-shell "~/.scripts/tmux-sessionizer.sh ~/projects/Hub"
bind-key -r k run-shell "~/.scripts/tmux-sessionizer.sh ~/projects/Cloudpilot/"
bind-key -r m run-shell "~/.scripts/tmux-sessionizer.sh ~/projects/misc"

# Keep at the bottom
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
run '~/.tmux/plugins/tpm/tpm'
